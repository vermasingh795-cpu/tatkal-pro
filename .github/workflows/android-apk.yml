
name: Build Tatkal Pro Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          cp pubspec.yaml /tmp/tatkal_pubspec.yaml
          cp lib/main.dart /tmp/tatkal_main.dart
          flutter create --platforms=android --project-name tatkal_pro --org com.tatkalpro .
          cp /tmp/tatkal_pubspec.yaml pubspec.yaml
          cp /tmp/tatkal_main.dart lib/main.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tatkal-pro-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          
